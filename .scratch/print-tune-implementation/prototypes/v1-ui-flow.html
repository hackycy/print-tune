<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintTune V1 页面与状态原型</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#182230;--muted:#667085;--line:#dce2ea;--blue:#175cd3;--blue2:#eaf2ff;--green:#067647;--greenbg:#ecfdf3;--red:#b42318;--redbg:#fef3f2;--amber:#b54708;--amberbg:#fffaeb;--shadow:0 8px 28px #10182814}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:88px}button,select,input{font:inherit}button{border:1px solid #cbd3df;background:#fff;color:var(--ink);border-radius:7px;padding:9px 14px;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--red);border-color:#f1b7b2;background:#fff}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1280px;margin:auto;padding:24px}.prototype-note{max-width:1280px;margin:16px auto 0;padding:10px 24px;color:var(--amber);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}.brand h1{font-size:21px;margin:0}.brand small,.muted{color:var(--muted)}.badge,.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;background:#eef1f5;color:#475467;white-space:nowrap}.badge.offline{background:var(--greenbg);color:var(--green)}.pill.warn{background:var(--amberbg);color:var(--amber)}.pill.error{background:var(--redbg);color:var(--red)}.pill.good{background:var(--greenbg);color:var(--green)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.panel h2,.panel h3{margin:0 0 12px}.panel h2{font-size:19px}.panel h3{font-size:15px}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:240px 1fr 300px;gap:14px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:18px}.step{padding:12px;border-bottom:3px solid var(--line);color:var(--muted)}.step.active{border-color:var(--blue);color:var(--blue);font-weight:600}.step.done{border-color:#84adff;color:#344054}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select,.field input{width:100%;padding:9px;border:1px solid #cbd3df;border-radius:7px;background:#fff}.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:12px 0}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}.notice{border-radius:9px;padding:12px 14px;margin:12px 0;background:var(--blue2);color:#1849a9}.notice.warn{background:var(--amberbg);color:var(--amber)}.notice.error{background:var(--redbg);color:var(--red)}.notice.good{background:var(--greenbg);color:var(--green)}.status-box{border-left:4px solid var(--blue);padding:12px 14px;background:#f8fafc;border-radius:6px}.status-box.error{border-color:var(--red);background:var(--redbg)}.status-box.good{border-color:var(--green);background:var(--greenbg)}.status-title{font-size:17px;font-weight:650}.timeline{list-style:none;margin:8px 0;padding:0}.timeline li{position:relative;padding:7px 0 7px 26px;color:var(--muted)}.timeline li:before{content:"";position:absolute;left:4px;top:13px;width:9px;height:9px;border-radius:50%;background:#c5ccd6}.timeline li.done{color:var(--green)}.timeline li.done:before{background:var(--green)}.timeline li.fail{color:var(--red)}.timeline li.fail:before{background:var(--red)}.timeline li.current{color:var(--blue)}.timeline li.current:before{background:var(--blue)}.printer-list{list-style:none;padding:0;margin:0}.printer-list li{padding:12px;border-radius:8px;margin-bottom:6px;cursor:pointer}.printer-list li.selected{background:var(--blue2);color:#1849a9}.printer-list small{display:block;color:var(--muted)}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}.scenario{display:flex;gap:10px;align-items:center;margin-bottom:14px}.scenario select{padding:7px;border:1px solid #cbd3df;border-radius:7px;background:#fff}.hero{max-width:760px;margin:36px auto}.hero .status-box{padding:24px}.hero .status-title{font-size:24px}.compact{font-size:13px}.checklist label{display:block;margin:8px 0}.checklist input{margin-right:7px}.code{font-family:Consolas,monospace;font-size:12px;background:#f8fafc;padding:8px;border-radius:6px;word-break:break-all}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#101828;color:#fff;padding:9px 12px;border-radius:999px;box-shadow:var(--shadow);z-index:20}.switcher button{background:#273449;border-color:#475467;color:#fff;border-radius:50%;width:34px;height:34px;padding:0}.switcher span{min-width:180px;text-align:center}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:950px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.app{padding:16px}.hero{margin:12px auto}}@media(max-width:560px){.steps{grid-template-columns:1fr 1fr}.kv{grid-template-columns:105px 1fr}.switcher span{min-width:130px;font-size:12px}}
</style>
</head>
<body>
<div class="prototype-note">一次性 UI 原型 · 所有操作均为内存模拟，不访问打印机 · 用 ← / → 或底部按钮切换三种布局</div>
<div id="app"></div>
<div class="switcher"><button id="prev" aria-label="上一个布局">←</button><span id="variantLabel"></span><button id="next" aria-label="下一个布局">→</button></div>
<script>
const Flow=(()=>{
const initial=()=>({variant:"A",scenario:"full",mode:"import",step:"select",level:"8",workingCopy:false,exported:false,elevated:false,backup:false,write:false,readback:false,applied:false,rolledBack:false,rollbackKind:null,job:"none",physical:"pending",recoveryHelp:false,log:["尚未修改系统配置"]});
const scenarios={full:{name:"完全匹配 · 正常流程",compatibility:"full",failure:"none"},limited:{name:"受限标准字段恢复",compatibility:"limited",failure:"none"},blocked:{name:"不兼容 · 禁止应用",compatibility:"blocked",failure:"none"},writeFail:{name:"写入失败 · 自动回滚",compatibility:"full",failure:"write"},rollbackFail:{name:"回滚失败 · 手动恢复",compatibility:"full",failure:"rollback"},testFail:{name:"已应用 · 测试提交失败",compatibility:"full",failure:"test"}};
function status(s){if(s.recoveryHelp)return["手动恢复备份","error"];if(s.step==="done"&&s.rolledBack)return[s.rollbackKind==="user"?"已恢复应用前备份":"应用失败 · 已回滚",s.rollbackKind==="user"?"good":"error"];if(s.step==="rollbackFailure")return["应用失败 · 回滚失败","error"];if(s.job==="failed")return["已应用 · 测试提交失败","error"];if(s.physical==="fail")return["已应用 · 纸面结果未通过","error"];if(s.physical==="pass")return["人工验收通过","good"];if(s.job==="submitted")return["测试作业已提交 · 待人工确认","good"];if(s.applied)return["已应用，回读通过 · 待测试","good"];if(s.step==="elevation")return["等待提权 · 配置未修改",""];return["未修改",""];}
function reduce(s,a){const n={...s};if(a.type==="variant"){n.variant=a.value;return n}if(a.type==="scenario")return{...initial(),variant:s.variant,scenario:a.value,level:s.level,log:["载入演示场景，系统配置未修改"]};if(a.type==="mode"){n.mode=a.value;n.step="select";return n}if(a.type==="level"){n.level=a.value;return n}if(a.type==="reset")return{...initial(),variant:s.variant,scenario:s.scenario};if(a.type==="original"){n.workingCopy=true;n.log=[...s.log,"原厂界面确认：仅更新内存工作副本"];return n}if(a.type==="export"){n.exported=true;n.log=[...s.log,"配置包已导出并重新打开校验"];return n}if(a.type==="review"){n.step="review";return n}if(a.type==="confirm"){n.step="confirm";return n}if(a.type==="apply"){if(s.level==="8"&&!s.elevated){n.step="elevation";return n}n.step="progress";n.backup=true;n.write=true;n.readback=true;n.applied=true;n.step="test";n.log=[...s.log,"双层备份完成","写入成功","同层回读通过"];const failure=scenarios[s.scenario].failure;if(failure==="write"||failure==="rollback"){n.write=false;n.readback=false;n.applied=false;n.rolledBack=true;n.rollbackKind="technical";n.step=failure==="rollback"?"rollbackFailure":"done";n.log=[...s.log,"写入失败：ERROR_WRITE_FAULT",failure==="rollback"?"回滚失败：helper 超时":"已恢复应用前备份并回读"];}return n}if(a.type==="elevate"){n.elevated=true;n.step="confirm";n.log=[...s.log,"用户确认短时提权 helper"];return n}if(a.type==="deny"){n.step="select";n.log=[...s.log,"已取消提权，未修改系统配置"];return n}if(a.type==="test"){if(scenarios[s.scenario].failure==="test"){n.job="failed";n.log=[...s.log,"GDI 测试作业提交失败"];}else{n.job="submitted";n.log=[...s.log,"GDI 测试作业已提交，等待人工确认"];}n.step="done";return n}if(a.type==="physicalPass"){n.physical="pass";n.log=[...s.log,"人工确认纸面与物理功能通过"];return n}if(a.type==="physicalFail"){n.physical="fail";n.log=[...s.log,"人工标记纸面结果未通过；配置仍已应用"];return n}if(a.type==="rollback"){n.applied=false;n.rolledBack=true;n.rollbackKind="user";n.job="none";n.physical="pending";n.log=[...s.log,"用户选择恢复应用前备份，回读通过"];return n}if(a.type==="keep"){n.log=[...s.log,"用户选择保留当前配置"];return n}if(a.type==="recoveryHelp"){n.recoveryHelp=!s.recoveryHelp;return n}return n}
return{initial,scenarios,status,reduce};
})();
let state=Flow.initial();state.variant=new URLSearchParams(location.search).get("variant")||"A";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const names={A:"分步向导",B:"运维工作台",C:"单任务恢复助手"};
function dispatch(a){state=Flow.reduce(state,a);if(a.type==="variant"){const u=new URL(location.href);u.searchParams.set("variant",state.variant);history.replaceState(null,"",u)}render()}
function scenarioControl(){return`<div class="scenario"><span class="muted">演示场景</span><select data-input="scenario">${Object.entries(Flow.scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?"selected":""}>${v.name}</option>`).join("")}</select><span class="pill">${state.level==="8"?"Level 8 → Level 8":"Level 9 → Level 9"}</span>${Flow.scenarios[state.scenario].compatibility==="limited"?'<span class="pill warn">受限恢复</span>':""}</div>`}
function brand(){return`<div class="top"><div class="brand"><div class="logo">印</div><div><h1>捷印 PrintTune</h1><small>打印首选项快照与恢复</small></div></div><span class="badge offline">纯离线 · 无服务端</span></div>`}
function statusBox(){const[t,c]=Flow.status(state);return`<div class="status-box ${c}"><div class="status-title">${t}</div><div class="muted">${state.applied?"系统配置已改变；按下方步骤继续验证":"除非明确显示“已应用”，否则系统配置未被修改"}</div></div>`}
function summary(){const sc=Flow.scenarios[state.scenario];return`<dl class="kv"><dt>目标队列</dt><dd>POS-80（演示）</dd><dt>目标驱动</dt><dd>POS-80 Series · 1.0.0.5 · x64</dd><dt>恢复作用层</dt><dd>${state.level==="8"?"队列默认值（Level 8）":"当前用户首选项（Level 9）"}</dd><dt>兼容结论</dt><dd>${sc.compatibility==="full"?"完全匹配且已验证":sc.compatibility==="limited"?"仅标准字段迁移":"不兼容"}</dd><dt>配置来源</dt><dd>SHA-256 通过 · 发布者来源未验证</dd></dl>${sc.compatibility==="limited"?'<div class="notice warn"><b>不会恢复：</b>浓度、切刀、钱箱等私有设置。仅在业务不依赖这些项目时继续；此状态不得写成完整恢复。</div>':""}`}
function timeline(){const items=[["配置与兼容校验",state.step!=="select"?"done":""],["应用前备份",state.backup?"done":""],["写入目标层",state.write?"done":state.step==="done"&&state.rolledBack?"fail":""],["同层回读",state.readback?"done":""],["GDI 测试作业",state.job==="submitted"?"done":state.job==="failed"?"fail":""],["人工纸面验收",state.physical==="pass"?"done":state.physical==="fail"?"fail":""]];return`<ul class="timeline">${items.map(([t,c])=>`<li class="${c}">${t}</li>`).join("")}</ul>`}
function actions(){const sc=Flow.scenarios[state.scenario];if(state.step==="select"){if(state.mode==="backup")return`<div class="actions"><button data-action="export" class="primary">备份并导出配置</button><button data-action="original">打开原厂首选项</button></div>`;if(state.mode==="template")return`<div class="actions"><button data-action="original" class="primary">用原厂界面制作工作副本</button><button data-action="export" ${state.workingCopy?"":"disabled"}>导出工作副本</button></div>`;return`<div class="actions"><button data-action="review" class="primary">检查配置与兼容性</button><button data-action="original">打开原厂首选项</button></div>`}if(state.step==="review")return`<div class="actions">${sc.compatibility==="blocked"?'<button disabled>不兼容，无法应用</button>':'<button data-action="confirm" class="primary">查看应用计划</button>'}<button data-action="reset">重新选择</button></div>`;if(state.step==="confirm")return`<div class="actions"><button data-action="apply" class="primary">备份并应用</button><button data-action="reset">取消</button></div>`;if(state.step==="elevation")return`<div class="actions"><button data-action="elevate" class="primary">允许短时提权</button><button data-action="deny">取消，不修改</button></div>`;if(state.step==="test")return`<div class="actions"><button data-action="test" class="primary">打印内置 GDI 测试页</button><button data-action="recoveryHelp">手动恢复备份</button></div>`;if(state.step==="rollbackFailure")return`<div class="actions"><button data-action="recoveryHelp" class="danger">查看手动恢复步骤</button><button data-action="reset">关闭演示</button></div>`;if(state.step==="done"){if(state.job==="submitted"&&state.physical==="pending")return`<div class="actions"><button data-action="physicalPass" class="primary">纸面与物理功能通过</button><button data-action="physicalFail" class="danger">纸面结果未通过</button></div>`;if(state.physical==="fail"||state.job==="failed")return`<div class="actions"><button data-action="rollback" class="danger">恢复应用前备份</button><button data-action="keep">保留当前配置</button><button data-action="test">重新测试</button></div>`;return`<div class="actions"><button data-action="reset" class="primary">完成</button></div>`}return""}
function selection(){return`<h2>选择打印机与任务</h2><div class="tabs">${[["import","导入配置"],["backup","备份现有"],["template","制作模板"]].map(([k,n])=>`<button data-mode="${k}" class="${state.mode===k?"active":""}">${n}</button>`).join("")}</div><div class="field"><label>目标打印机</label><select><option>POS-80 · POS-80 Series · USB001</option><option>Microsoft Print to PDF · 虚拟队列</option></select></div><div class="field"><label>读取 / 写入作用层</label><select data-input="level"><option value="8" ${state.level==="8"?"selected":""}>Level 8 · 队列默认值</option><option value="9" ${state.level==="9"?"selected":""}>Level 9 · 当前用户首选项</option></select></div>${state.mode==="import"?'<div class="field"><label>配置包</label><input value="80mm票据打印机配置.ptcfg" readonly></div>':""}${state.mode==="template"?'<div class="notice">原厂界面确认后只修改工作副本。只有显式“应用到系统”才写回驱动。</div>':""}${state.workingCopy?'<div class="notice good">工作副本已更新 · 系统配置未修改</div>':""}${state.exported?'<div class="notice good">配置包已导出并重新校验 · 系统配置未修改</div>':""}`}
function mainContent(){if(state.step==="select")return selection();if(state.step==="review")return`<h2>兼容性与恢复范围</h2>${summary()}${Flow.scenarios[state.scenario].compatibility==="blocked"?'<div class="notice error">当前打印机与配置不匹配。请重新选择配置或在目标驱动中重新制作模板；没有“强制执行”按钮。</div>':""}`;if(state.step==="confirm"||state.step==="elevation")return`<h2>确认应用计划</h2>${summary()}<div class="notice warn">应用前自动备份 ${state.level==="8"?"Level 8 和当前用户 Level 9":"当前用户 Level 9"}。写入或回读失败将自动回滚；不会改变系统默认打印机。</div>${state.step==="elevation"?'<div class="notice">需要短时提权 helper 完成 Level 8 写入。helper 不处理 Level 9，不常驻后台。</div>':""}`;if(state.recoveryHelp)return`<h2>手动恢复备份</h2><div class="notice error">自动回滚未完成。不要继续反复应用配置。</div><ol><li>保留当前诊断信息与原始终端状态。</li><li>打开受控备份目录，找到事务 <span class="code">PT-20261025-0042</span>。</li><li>按备份中的来源层分别恢复；Level 8 事务还需恢复原交互用户 Level 9。</li><li>完成同层回读，再打印 GDI 测试页。</li></ol><div class="code">C:\\ProgramData\\PrintTune\\Backups\\PT-20261025-0042\\</div>`;if(state.step==="test"||state.step==="done")return`<h2>验证与人工确认</h2>${statusBox()}<div class="notice">内置测试页通过 GDI 显式携带 DEVMODE。作业提交成功不等于出纸、切刀或钱箱正确。</div>${state.job==="submitted"?'<div class="checklist"><label><input type="checkbox">纸张尺寸与走纸正确</label><label><input type="checkbox">浓度与打印区域正确</label><label><input type="checkbox">切刀、钱箱等实际功能正确</label></div>':""}`;return`<h2>正在应用</h2>`}
function VariantA(){const idx={select:0,review:1,confirm:2,elevation:2,progress:2,test:3,done:3,rollbackFailure:3}[state.step];return`<div class="app">${brand()}${scenarioControl()}<div class="steps">${["选择任务","兼容检查","备份与应用","测试与验收"].map((x,i)=>`<div class="step ${i===idx?"active":i<idx?"done":""}">${i+1}. ${x}</div>`).join("")}</div><div class="grid2"><div class="panel">${mainContent()}${actions()}</div><div class="stack"><div class="panel"><h3>当前状态</h3>${statusBox()}</div><div class="panel"><h3>执行进度</h3>${timeline()}</div></div></div><div class="footer-note">布局 A：把高风险操作拆成明确步骤，适合客服与现场操作人员。</div></div>`}
function VariantB(){return`<div class="app">${brand()}${scenarioControl()}<div class="grid3"><div class="panel"><h3>打印机队列</h3><ul class="printer-list"><li class="selected">POS-80<small>USB001 · x64</small></li><li>Microsoft Print to PDF<small>虚拟队列</small></li><li>Microsoft XPS Document Writer<small>虚拟队列</small></li></ul><div class="notice compact">只枚举，不改变系统默认打印机。</div></div><div class="panel">${mainContent()}${actions()}</div><div class="stack"><div class="panel"><h3>事务状态</h3>${statusBox()}${timeline()}</div><div class="panel"><h3>诊断摘要</h3><div class="code">scope: Level ${state.level}<br>backup: ${state.backup}<br>applied: ${state.applied}<br>rolledBack: ${state.rolledBack}<br>job: ${state.job}</div></div></div></div><div class="footer-note">布局 B：信息密度高，适合支持人员同时观察队列、事务和诊断。</div></div>`}
function VariantC(){return`<div class="app">${brand()}<div class="hero">${scenarioControl()}${statusBox()}<div class="panel" style="margin-top:14px">${mainContent()}${actions()}</div><div class="panel"><h3>这次操作发生了什么</h3>${timeline()}<div class="muted">只显示当前任务；详细驱动信息在兼容检查页展示。</div></div></div><div class="footer-note">布局 C：以当前状态和下一动作中心，减少现场认知负担。</div></div>`}
function render(){document.getElementById("app").innerHTML=state.variant==="A"?VariantA():state.variant==="B"?VariantB():VariantC();document.getElementById("variantLabel").textContent=state.variant+" · "+names[state.variant];document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>dispatch({type:b.dataset.action}));document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>dispatch({type:"mode",value:b.dataset.mode}));document.querySelectorAll("[data-input]").forEach(el=>el.onchange=e=>dispatch({type:e.target.dataset.input,value:e.target.value}));}
function cycle(d){const keys=["A","B","C"],i=keys.indexOf(state.variant);dispatch({type:"variant",value:keys[(i+d+3)%3]})}document.getElementById("prev").onclick=()=>cycle(-1);document.getElementById("next").onclick=()=>cycle(1);document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});render();
</script>
</body>
</html>
